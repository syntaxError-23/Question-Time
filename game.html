<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Question Time</title>
    <link rel="stylesheet" href="styles/game.css">
</head>
<body>

    <div class="modal hide" id="modal">
        <div class="modal__content">
            <div class="modal__text">
                <p class="modal__msg" id="modalMsg">THAT'S ALL FOLKS</p>
                <p class="modal__score" id="modalScore"></p>
            </div>

            <div class="modal__btn-container">
                <button class="modal__new-game-btn" id="newGameBtn">NEW GAME</button>
                <button class="modal__home-btn" id="homeBtn" >HOME</button>
            </div>
        </div>
    </div>

    <!-- ---------- LOGO SECTION ---------- -->
    <section class="logo-section">
        <div class="logo-section__home-btn-wrapper">
            <img class="logo-section__home-icon" id="homeIcon" src="./assets/home.png" alt="home icon">
        </div>

        <div class="logo-section__logo-wrapper">
            <p class="logo-section__presents" >SE23 <br> Presents</p>
            <h1 class="logo-section__logo" >QUESTION TIME</h1>
        </div>
    </section>

    <!-- ---------- SCORES SECTION ---------- -->
    <section class="scores">
        <p class="scores__points-this-ques" id="pointsThisQues">SELECT A QUESTION</p>
        <p class="scores__scoreboard" id="scoreboard">SCORE: 0</p>
    </section>

    <main class="game-area ">
        <section id="choices" class="game-area__choices-area-wrapper">
            
            <!-- ---------- CHOICES GRID   ---------- -->
            <article class="game-area__choices-container">
                <div class="game-area__choices-container__choices-grid-item grid-item" tabindex="0" id="1">100 POINTS</div>
                <div class="game-area__choices-container__choices-grid-item grid-item" tabindex="0" id="2">100 POINTS</div>
                <div class="game-area__choices-container__choices-grid-item grid-item" tabindex="0" id="3">100 POINTS</div>
                <div class="game-area__choices-container__choices-grid-item grid-item" tabindex="0" id="4">200 POINTS</div>
                <div class="game-area__choices-container__choices-grid-item grid-item" tabindex="0" id="5">200 POINTS</div>
                <div class="game-area__choices-container__choices-grid-item grid-item" tabindex="0" id="6">200 POINTS</div>
                <div class="game-area__choices-container__choices-grid-item grid-item" tabindex="0" id="7">300 POINTS</div>
                <div class="game-area__choices-container__choices-grid-item grid-item" tabindex="0" id="8">300 POINTS</div>
                <div class="game-area__choices-container__choices-grid-item grid-item" tabindex="0" id="9">300 POINTS</div>
            </article>       

            <button id="confirmChoicebtn" class="game-area__confirm-btn">CONFIRM</button>
        </section>

        <!-- ---------- QUESTIONS AND ANSWERS   ---------- -->

        <section id="question" class="question-area-wrapper hide transparent">

            <div class="question-area-wrapper__question-container">

                <div class="question-area-wrapper__question">
                    <p id="qText" class="question-area-wrapper__question-text"></p>
                </div>

                <div class="question-area-wrapper__answers">
                    <p class="question-area-wrapper__answer-text aText" tabindex="0" ></p>
                    <p class="question-area-wrapper__answer-text aText" tabindex="0" ></p>
                    <p class="question-area-wrapper__answer-text aText" tabindex="0" ></p>
                    <p class="question-area-wrapper__answer-text aText" tabindex="0" ></p>
                </div>

                <div class="game-area__btns-container">
                    <button id="confirmAnsBtn" class="game-area__confirm-ans-btn">CONFIRM</button>
                    <button class="game-area__next-ques-btn hide" id="nextQuesBtn">NEXT QUESTION</button>
                </div>

            </div>
        </section>

    </main>
</body>
<script type="module" src="./scripts/game.js"></script>
</html>
